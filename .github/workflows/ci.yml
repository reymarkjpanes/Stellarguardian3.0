name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: type-check, lint, unit tests ──────────────────────────────────
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
        env:
          # Minimal stubs so modules that read env vars don't crash in CI
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          LOCAL_ENCRYPTION_KEY: ci-placeholder-encryption-key-32chars!!
          STELLAR_NETWORK_MODE: testnet
          STELLAR_MAINNET_ENABLED: "false"
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          ESCROW_CONTRACT_ID: CAF2TCCKNRTUNANF6YFMRU764GQKGCSLRN3RKQEO4XJJGMCQF5ED6ZAT
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CRON_SECRET: ci-cron-secret

  # ── Soroban contract: Rust tests ────────────────────────────────────────────
  contract:
    name: Soroban Contract (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy, rust-src

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run contract unit tests
        run: cargo test --locked

      - name: Build WASM (verify contract compiles)
        run: cargo build --locked --target wasm32v1-none --release
