name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: type-check, lint, unit tests ──────────────────────────────────
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
        env:
          # Minimal stubs so modules that read env vars don't crash in CI
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          LOCAL_ENCRYPTION_KEY: ci-placeholder-encryption-key-32chars!!
          STELLAR_NETWORK_MODE: testnet
          STELLAR_MAINNET_ENABLED: "false"
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          ESCROW_CONTRACT_ID: CAF2TCCKNRTUNANF6YFMRU764GQKGCSLRN3RKQEO4XJJGMCQF5ED6ZAT
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CRON_SECRET: ci-cron-secret

  # ── Soroban contract: Rust tests ────────────────────────────────────────────
  contract:
    name: Soroban Contract (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract unit tests
        run: cargo test --features testutils

      - name: Build WASM (verify contract compiles)
        run: cargo build --target wasm32-unknown-unknown --release
