[package]
name = "stellar-guardian-escrow"
version = "1.0.0"
edition = "2021"
description = "Soroban escrow smart contract for Stellar Guardian prize distribution"
license = "MIT"
rust-version = "1.84"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=22.0.0"

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }

# Cap ed25519-dalek to 2.x so soroban-env-host testutils compiles correctly.
# ed25519-dalek 3.x requires rand_core 0.9.x but soroban-env-host uses
# ChaCha20Rng from rand_core 0.6.x — the two are incompatible.
# This is a known upstream bug in the soroban-env-host 22.1.x testutils feature.
[patch.crates-io]
ed25519-dalek = { version = "=2.2.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
